<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập liên kết HTML</title>
</head>
<body>

    <!-- Tiêu đề theo yêu cầu -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách không thứ tự (ul) chứa các liên kết -->
    <ul>
        <!-- 1. Mở tab mới với target="_blank" -->
        <li>
            <a href="https://github.com" target="_blank">GitHub (Mở tab mới)</a>
        </li>

        <!-- 2. Liên kết ngoài thông thường -->
        <li>
            <a href="https://www.google.com">Google Tìm kiếm</a>
        </li>

        <!-- 3. Liên kết nội bộ đến file about.html cùng thư mục -->
        <li>
            <a href="about.html">Về bản thân tôi (Trang nội bộ)</a>
        </li>

        <!-- 4. Liên kết email sử dụng mailto: -->
        <li>
            <a href="mailto:example@gmail.com">Gửi email cho tôi</a>
        </li>
    </ul>

</body>
</html>
